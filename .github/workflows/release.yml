name: Build release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.1"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set package version
        shell: pwsh
        run: npm version "${{ inputs.version }}" --workspaces --include-workspace-root --no-git-tag-version

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate source
        run: |
          npm run typecheck
          npm test
          npm audit --omit=dev
          npm audit --audit-level=high

      - name: Build Windows installer
        run: npm run package:win

      - name: Launch the packaged app
        run: npm run smoke-test --workspace=@mcp-connector/desktop

      - name: Build VS Code extension
        run: npm run package:vscode

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: MCP Connector v${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            apps/desktop/release/*
            apps/vscode-extension/*.vsix
