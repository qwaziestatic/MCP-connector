name: Build release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0-beta.1 or 0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set package version
        shell: pwsh
        run: npm version "${{ inputs.version }}" --workspaces --include-workspace-root --no-git-tag-version

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate source
        run: |
          npm run typecheck
          npm test
          npm audit --omit=dev
          npm audit --audit-level=high

      - name: Build Windows installer
        run: npm run package:win
        env:
          # Public sign-in settings built into the app; see DEPLOYMENT.md.
          MCP_GITHUB_CLIENT_ID: ${{ vars.MCP_GITHUB_CLIENT_ID }}
          MCP_NOTION_SIGN_IN_URL: ${{ vars.MCP_NOTION_SIGN_IN_URL }}

      - name: Launch the packaged app
        run: npm run smoke-test --workspace=@mcp-connector/desktop

      - name: Build VS Code extension
        run: npm run package:vscode

      - name: Build the agent skill
        run: npm run package:skill

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: MCP Connector v${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          # Install steps first, then the changes since the last release.
          body_path: .github/release-notes.md
          generate_release_notes: true
          # Only what users download: the installer, the extension and the
          # skill. The builder's other files (blockmaps, update metadata, the
          # unpacked folder) are for an updater this release does not have.
          fail_on_unmatched_files: true
          files: |
            apps/desktop/release/*.exe
            apps/vscode-extension/*.vsix
            release/mcp-connector-skill.zip
